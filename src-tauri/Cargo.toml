[package]
name = "tapeout-live"
version = "0.2.0"
edition = "2021"
description = "TapeOutScan wallet and network desktop monitor"
license = "MIT"

[lib]
name = "tapeout_live"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSScreen", "NSWindow"] }

[dev-dependencies]
tempfile = "3"
